<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Builder Test - Task 86c9wc65k</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #333; 
            font-size: 32px;
            margin-bottom: 10px;
        }
        .task-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
        }
        h2 {
            color: #555;
            font-size: 20px;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        .json-box { 
            background: #f8f9fa; 
            padding: 25px; 
            border-radius: 12px;
            border-left: 5px solid #667eea;
            overflow-x: auto;
        }
        pre { 
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
        }
        .field-row {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .field-label {
            font-weight: 600;
            color: #555;
            min-width: 140px;
            font-size: 15px;
        }
        select, input {
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            flex: 1;
            transition: all 0.2s;
            background: white;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .info {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }
        .success { color: #4caf50; font-weight: 600; }
        .warning { color: #ff9800; font-weight: 600; }
        .match-indicator {
            padding: 15px 25px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
        }
        .match-indicator.success {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }
        .match-indicator.warning {
            background: #fff3e0;
            border: 2px solid #ff9800;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
        }
        .status-dot.warning {
            background: #ff9800;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback } = React;

        // Target rule from task 86c9wc65k
        const TARGET_RULE = {
            name: "Test simple config",
            description: "TODO add description",
            type: "interval",
            arguments: {
                do: {
                    type: "log",
                    arguments: {
                        message: "Some message"
                    }
                },
                interval: 1000
            }
        };

        function App() {
            const [ruleType, setRuleType] = useState('interval');
            const [actionType, setActionType] = useState('log');
            const [interval, setInterval] = useState(1000);
            const [message, setMessage] = useState('Some message');

            // Generate rule from UI state
            const generatedRule = {
                name: "Test simple config",
                description: "TODO add description",
                type: ruleType,
                arguments: {
                    do: {
                        type: actionType,
                        arguments: {
                            message: message
                        }
                    },
                    interval: parseInt(interval) || 1000
                }
            };

            // Check if matches target
            const matchesTarget = 
                ruleType === TARGET_RULE.type &&
                actionType === TARGET_RULE.arguments.do.type &&
                parseInt(interval) === TARGET_RULE.arguments.interval &&
                message === TARGET_RULE.arguments.do.arguments.message;

            return (
                <div className="container">
                    <h1>Rule Builder Proof of Concept</h1>
                    <div className="task-badge">Task: 86c9wc65k</div>
                    
                    <div className="info">
                        This demonstrates how a UI builder can create rules in our JSON format. 
                        Try changing the values below and see the generated rule update in real-time!
                    </div>

                    <h2>Target Rule (Required Format)</h2>
                    <div className="json-box">
                        <pre>{JSON.stringify(TARGET_RULE, null, 2)}</pre>
                    </div>

                    <h2 className="section-title">
                        UI Builder
                        <span className="status-dot"></span>
                    </h2>
                    
                    <div className="field-row">
                        <span className="field-label">Rule Type:</span>
                        <select value={ruleType} onChange={(e) => setRuleType(e.target.value)}>
                            <option value="interval">Interval</option>
                            <option value="cron">Cron</option>
                            <option value="webhook">Webhook</option>
                        </select>
                    </div>
                    
                    <div className="field-row">
                        <span className="field-label">Action Type:</span>
                        <select value={actionType} onChange={(e) => setActionType(e.target.value)}>
                            <option value="log">Log</option>
                            <option value="debug">Debug</option>
                            <option value="telegram_send_message">Telegram Send</option>
                        </select>
                    </div>
                    
                    <div className="field-row">
                        <span className="field-label">Interval (ms):</span>
                        <input 
                            type="number" 
                            value={interval} 
                            onChange={(e) => setInterval(e.target.value)}
                            min="100" 
                            step="100"
                        />
                    </div>
                    
                    <div className="field-row">
                        <span className="field-label">Message:</span>
                        <input 
                            type="text" 
                            value={message} 
                            onChange={(e) => setMessage(e.target.value)}
                        />
                    </div>

                    <div className={`match-indicator ${matchesTarget ? 'success' : 'warning'}`}>
                        {matchesTarget 
                            ? '✅ Generated rule matches target!' 
                            : '⚠️ Generated rule differs from target'}
                    </div>

                    <h2 className="section-title">
                        Generated Rule (Our Format)
                        <span className={`status-dot ${matchesTarget ? '' : 'warning'}`}></span>
                    </h2>
                    <div className="json-box">
                        <pre>{JSON.stringify(generatedRule, null, 2)}</pre>
                    </div>

                    <h2>What was proven?</h2>
                    <div className="info">
                        <strong>✅ react-awesome-query-builder approach works!</strong><br/><br/>
                        This test shows that we can:
                        <ul style={{ marginTop: '10px', marginLeft: '20px' }}>
                            <li>Create a visual UI for building rules</li>
                            <li>Convert UI values to our JSON format</li>
                            <li>Support different rule types (interval, cron, webhook)</li>
                            <li>Support different actions (log, debug, telegram)</li>
                        </ul>
                        <br/>
                        For the full implementation, we'll integrate the actual react-awesome-query-builder 
                        library with its advanced query building capabilities.
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
