#version: '3.8'

x-postgres-common: &postgres-common
  image: postgres:16
  restart: always
  environment:
    POSTGRES_USER: ${DB_USER}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: ${DB_NAME}
  ports:
    - "${DB_PORT}:5432"

x-migrations-common: &migrations-common
  build:
    context: .
    dockerfile: libs/models/Dockerfile

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}

x-volume-common: &volume-common
  driver: local
  driver_opts:
    type: none
    o: bind
    device: ${DOCKER_DB_VOLUME}

services:
  postgres:
    <<: *postgres-common
    container_name: postgres
    profiles:
      - development
      - api-service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_bot_network
  postgres-int-tests:
    <<: *postgres-common
    container_name: postgres-int-tests
    profiles:
      - api-service-int-tests
    volumes:
      - postgres_data_int_tests:/var/lib/postgresql/data
    networks:
      - trading_bot_int_tests_network
# Seems like not perfect idea to use migration as a docker container.
  migrations:
    <<: *migrations-common
    container_name: migrations
    environment:
      <<: *db-env
      DB_HOST: postgres
    profiles:
      - not-used
    networks:
      - trading_bot_network

  migrations-int-tests:
    <<: *migrations-common
    container_name: migrations-int-tests
    environment:
      <<: *db-env
      DB_HOST: postgres-int-tests
    profiles:
      - not-used
    networks:
      - trading_bot_int_tests_network

  auto-trader:
    build:
      context: .
      dockerfile: apps/auto-trader/Dockerfile
    container_name: auto-trader
    restart: always
    ports:
      - "3000:3000"
    environment:
      <<: *db-env
    profiles:
      - development
    networks:
      - trading_bot_network

volumes:
  postgres_data:
    <<: *volume-common
  postgres_data_int_tests:
    <<: *volume-common

networks:
  trading_bot_network:
    driver: bridge
  trading_bot_int_tests_network:
    driver: bridge
