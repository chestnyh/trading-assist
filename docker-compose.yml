#version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    profiles:
      - external
      - init-external
      - development
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_bot_network
  migrations:
    build:
      context: .
      dockerfile: libs/models/Dockerfile
    container_name: migrations  
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    profiles:
      - init-external
    networks:
      - trading_bot_network
  auto-trader:
    build:
      context: .
      dockerfile: apps/auto-trader/Dockerfile  
    container_name: auto-trader
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    profiles:
      - development
    networks:
      - trading_bot_network


volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_DB_VOLUME}

networks:
  trading_bot_network:
    driver: bridge
